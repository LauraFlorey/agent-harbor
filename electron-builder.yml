# Retained for compatibility with existing OS permissions and installations.
# The visible product identity is Agent Harbor; changing this identifier needs
# a dedicated signed-app migration.
appId: com.openmausbot.app
productName: Agent Harbor
artifactName: Agent-Harbor-${version}-${arch}.${ext}

# Retain update metadata compatibility for a possible owner-approved private
# checkpoint. Normal personal builds use --publish never and do not distribute
# artifacts. If updates are used later, verify the exact private delivery path
# before replacing Laura's known-good installation.
publish:
  - provider: github
    owner: LauraFlorey
    repo: agent-harbor

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/Agent Harbor Speech.app/**"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  - from: dist
    to: ui
  - from: dist-server
    to: server

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: electron/resources/Agent Harbor Speech.app
      to: Agent Harbor Speech.app
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for macOS arm64.
    - from: dist-native/cua-driver
      to: cua-driver
    - from: dist-native/cua-sdk
      to: cua-sdk
  extendInfo:
    NSMicrophoneUsageDescription: Agent Harbor uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: Agent Harbor transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: Agent Harbor uses Accessibility when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: Agent Harbor uses Screen Recording so bots can see this Mac before acting.
  # Notarization runs manually after the build (notarytool + staple),
  # mirroring the BlueyLite ship_release.sh flow.
  notarize: false

dmg:
  sign: true
  artifactName: Agent-Harbor-${version}.dmg

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  # No signing config yet (would go under win.signtoolOptions or
  # win.azureSignOptions — eb 26 nests it, there is no top-level
  # win.certificateFile). The installer is unsigned, so SmartScreen shows
  # "unknown publisher" on first run (README says so). verifyUpdateCodeSignature
  # defaults true, but electron-updater skips the check when app-update.yml
  # carries no publisherName — so auto-update still works today. Do NOT set
  # publisherName without actually signing, or every update is rejected as
  # untrusted; and once signed, keep the cert subject stable (or list both old
  # and new in publisherName) or you strand already-installed users.

nsis:
  oneClick: true
  perMachine: false
  shortcutName: Agent Harbor
  # Versioned, like the .dmg, so private checkpoints remain identifiable.
  artifactName: Agent-Harbor-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: build/icon.svg
  category: Utility
  executableName: agent-harbor
  synopsis: Your own team of AI bots, in a chat app
  description: A local-first chat app for running a team of AI agents.
  maintainer: Laura Florey <52425450+LauraFlorey@users.noreply.github.com>
  vendor: Agent Harbor
  syncDesktopName: true
  desktop:
    entry:
      Name: Agent Harbor
      Comment: Your own team of AI bots, in a chat app
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageCategory: utils
  priority: optional

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"
