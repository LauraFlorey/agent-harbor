# Optional private Windows installer, built on a real Windows runner and kept
# as a workflow artifact.
#
# Why this exists: a Mac cannot build
# an NSIS installer (electron-builder needs wine, and a cross-built exe
# that never ran on Windows is exactly the artifact that looks fine and
# breaks in use). Run this only when Laura needs a Windows checkpoint, from the
# same commit as the corresponding personal build.
#
# Deliberately artifact-only: this workflow has no publishing credentials.
name: Package Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the packaged app ships compiled JS, so a stale dist/ or dist-server/
      # would ride along unsigned-for and unsealed (the 0.1.15 "damaged"
      # incident) — a fresh checkout is clean, but be explicit
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      # Three things silently produce an installer that builds fine and is
      # broken in use, and none of them can be checked from the Mac creating
      # the personal checkpoint. Assert them where the unpacked tree exists.
      - name: verify the packaged tree
        shell: bash
        run: |
          res=release/win-unpacked/resources
          fail=0
          # missing → utilityProcess.fork fails → the 🐭 "Couldn't start the
          # bot server" page
          [ -f "$res/server/index.js" ] || { echo "::error::missing $res/server/index.js"; fail=1; }
          # missing → the server has nothing to serve → black window
          [ -f "$res/ui/index.html" ] || { echo "::error::missing $res/ui/index.html"; fail=1; }
          [ -f "$res/app-update.yml" ] || { echo "::error::missing $res/app-update.yml"; fail=1; }
          if [ -f "$res/app-update.yml" ]; then
            grep -q "agent-harbor" "$res/app-update.yml" || {
              echo "::error::app-update.yml does not point at Agent Harbor releases"; fail=1; }
            # while the build is unsigned, a publisherName makes
            # electron-updater reject every update as untrusted
            if grep -q "publisherName" "$res/app-update.yml"; then
              echo "::error::app-update.yml carries publisherName on an unsigned build"; fail=1
            fi
          fi
          echo "--- app-update.yml ---"; cat "$res/app-update.yml" 2>/dev/null || true
          exit $fail

      # Unsigned checkpoints must not become public installer downloads.
      # A signed release workflow must be reviewed before public distribution.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: github.event.repository.private
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14
