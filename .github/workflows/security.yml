name: Security checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit the full dependency tree
        run: pnpm audit --audit-level=moderate
      - name: Scan history with checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scan_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scan_dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$scan_dir/gitleaks.tar.gz" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git . --log-opts=HEAD --redact --no-banner
      - name: Review newly introduced dependencies
        if: github.event_name == 'pull_request' && github.event.repository.private == false
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          fail-on-severity: moderate
