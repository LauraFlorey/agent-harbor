name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# least privilege: CI only reads the checkout, it never writes back
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: typecheck + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The harness and pure desktop capabilities stay portable across all
        # supported host platforms. POSIX-only process tests self-skip.
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm check:electron
      - run: pnpm build:server
      - run: pnpm check:server-package
      - name: production UI build
        if: matrix.os != 'windows-latest'
        run: pnpm exec vite build
      - name: Isolated desktop authentication and navigation test
        if: matrix.os == 'macos-latest'
        run: pnpm test:desktop-security

  package-linux:
    name: package + smoke (Ubuntu 24.04 x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install package validation tools
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils xvfb dbus-x11
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:linux
      - run: node scripts/verify-linux-package.mjs
      - name: Relocate the package outside the checkout
        run: cp -a release/linux-unpacked "$RUNNER_TEMP/agent-harbor-package"
      - name: Configure Chromium sandbox for the unpacked app
        run: |
          sudo chown root:root "$RUNNER_TEMP/agent-harbor-package/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/agent-harbor-package/chrome-sandbox"
          test "$(stat -c '%U:%G %a' "$RUNNER_TEMP/agent-harbor-package/chrome-sandbox")" = "root:root 4755"
      - name: Launch packaged app and verify lifecycle
        env:
          OMB_SMOKE_EXECUTABLE: ${{ runner.temp }}/agent-harbor-package/agent-harbor
        run: dbus-run-session -- xvfb-run -a node scripts/smoke-linux-package.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        # Automatic runs prove packaging above. Retain installers only when
        # someone explicitly launches this workflow to retrieve a build.
        if: always() && github.event_name == 'workflow_dispatch' && github.event.repository.private
        with:
          name: agent-harbor-ubuntu-x64
          path: |
            release/*.deb
            release/*.AppImage
          if-no-files-found: error
          retention-days: 1
