<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Agent Harbor</title>
  <desc id="desc">A teal beacon above an abstract letter A and two harbor waves on a midnight app tile.</desc>

  <defs>
    <clipPath id="mac-tile">
      <rect width="1024" height="1024" rx="230.4" />
    </clipPath>
    <radialGradient id="tile" cx="50%" cy="28%" r="86%">
      <stop offset="0" stop-color="#17283A" />
      <stop offset="0.58" stop-color="#0B1420" />
      <stop offset="1" stop-color="#060A11" />
    </radialGradient>
    <linearGradient id="mark" x1="29%" y1="28%" x2="75%" y2="82%">
      <stop offset="0" stop-color="#8BF6E7" />
      <stop offset="0.48" stop-color="#31C6DF" />
      <stop offset="1" stop-color="#3478F6" />
    </linearGradient>
    <linearGradient id="signal" x1="35%" y1="20%" x2="70%" y2="85%">
      <stop offset="0" stop-color="#FFE59A" />
      <stop offset="1" stop-color="#FFAA43" />
    </linearGradient>
    <linearGradient id="left-beam" x1="100%" y1="50%" x2="0" y2="50%">
      <stop offset="0" stop-color="#79F2E4" stop-opacity="0.28" />
      <stop offset="1" stop-color="#79F2E4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="right-beam" x1="0" y1="50%" x2="100%" y2="50%">
      <stop offset="0" stop-color="#58B9FF" stop-opacity="0.24" />
      <stop offset="1" stop-color="#58B9FF" stop-opacity="0" />
    </linearGradient>
    <filter id="signal-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- Keep the artwork inside the standard macOS 824px icon grid. -->
  <g transform="translate(100 100) scale(0.8046875)">
    <g clip-path="url(#mac-tile)">
      <rect width="1024" height="1024" fill="url(#tile)" />
      <circle cx="512" cy="650" r="342" fill="none" stroke="#78DDE9" stroke-opacity="0.055" stroke-width="28" />
      <circle cx="512" cy="650" r="242" fill="none" stroke="#5A9DF5" stroke-opacity="0.05" stroke-width="20" />

      <path d="M466 292 L112 185 L112 399 L466 318 Z" fill="url(#left-beam)" />
      <path d="M558 292 L912 185 L912 399 L558 318 Z" fill="url(#right-beam)" />

      <circle cx="512" cy="300" r="82" fill="#FFB54B" opacity="0.16" filter="url(#signal-glow)" />
      <circle cx="512" cy="300" r="54" fill="url(#signal)" />
      <circle cx="494" cy="281" r="13" fill="#FFF8D6" opacity="0.9" />
      <path d="M512 354 V390" stroke="#8BF6E7" stroke-width="24" stroke-linecap="round" />

      <path
        d="M512 360 L710 742 H602 L558 646 H466 L422 742 H314 Z M512 478 L472 566 H552 Z"
        fill="url(#mark)"
        fill-rule="evenodd"
      />
      <rect x="442" y="592" width="140" height="34" rx="17" fill="url(#signal)" />

      <path d="M264 770 C352 720 436 720 512 770 C588 820 672 820 760 770" fill="none" stroke="#56DCCA" stroke-width="34" stroke-linecap="round" />
      <path d="M306 844 C378 807 446 807 512 844 C578 881 646 881 718 844" fill="none" stroke="#438CF4" stroke-width="24" stroke-linecap="round" />

      <rect x="8" y="8" width="1008" height="1008" rx="222.4" fill="none" stroke="#BCEEFF" stroke-opacity="0.09" stroke-width="16" />
    </g>
  </g>
</svg>
